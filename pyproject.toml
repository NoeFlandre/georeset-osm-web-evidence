[project]
name = "georeset-osm-web-evidence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "folium>=0.20.0",
    "geopandas>=1.1.3",
    "huggingface-hub>=1.17.0",
    "openpyxl>=3.1.5",
    "pyarrow>=24.0.0",
    "pyproj>=3.7.1",
    "requests>=2.34.2",
    "shapely>=2.1.2",
    "trafilatura>=2.0.0",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.13.0",
    "mutmut>=3.4.0",
    "pytest>=9.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/georeset_osm_web_evidence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["georeset_osm_web_evidence"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.mutmut]
source_paths = ["src/georeset_osm_web_evidence"]
also_copy = ["scripts/"]
pytest_add_cli_args = ["-q"]
pytest_add_cli_args_test_selection = ["tests"]
do_not_mutate = [
    "src/georeset_osm_web_evidence/**/__init__.py",
]
